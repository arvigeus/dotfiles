general {
    lock_cmd = pgrep -x hyprlock >/dev/null || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = desktop-idle blank
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 360
    condition_cmd = desktop-idle allow-session-idle
    condition_retry = 10
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    condition_cmd = desktop-idle allow-session-idle
    condition_retry = 10
    on-timeout = systemctl --check-inhibitors=yes suspend
}
