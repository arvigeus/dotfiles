general {
    lock_cmd = pgrep -x hyprlock >/dev/null || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; hyprctl dispatch 'hl.dsp.event("desktop-displays-changed")'
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = desktop-idle blank
    # Turn displays on, then let the shell reapply adjustments skipped while dark.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; hyprctl dispatch 'hl.dsp.event("desktop-displays-changed")'
}

listener {
    timeout = 360
    condition_cmd = desktop-idle allow-lock
    condition_retry = 10
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    condition_cmd = desktop-idle allow-sleep
    condition_retry = 10
    on-timeout = systemctl --check-inhibitors=yes suspend
}
