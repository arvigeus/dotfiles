<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.dotfiles.Ports1"/></policy>
  <policy context="default">
    <allow send_destination="org.dotfiles.Ports1" send_interface="org.dotfiles.Ports1" send_member="Request"/>
    <allow send_destination="org.dotfiles.Ports1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.dotfiles.Ports1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.dotfiles.Ports1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
