[misc]
# Disks owns manual cleanup; retain package caches for rollback and pacdiff.
cleanup = false
# Use pacdiff's sudoedit support so Meld runs as the desktop user.
# Claude and Pi executables are updated by pacman/AUR.
disable = ["config_update", "claude_code", "pi"]

[commands]
"Pi extensions" = "if command -v pi >/dev/null 2>&1; then pi update --extensions; fi"

[linux]
show_arch_news = true

[pre_commands]
"Snapshot maintenance context" = "if command -v system-agent >/dev/null 2>&1; then system-agent snapshot; fi"

[post_commands]
"Review packages, configuration and services" = "package-maintenance"
"Review system changes" = "if command -v system-agent >/dev/null 2>&1; then system-agent after-update; fi"
