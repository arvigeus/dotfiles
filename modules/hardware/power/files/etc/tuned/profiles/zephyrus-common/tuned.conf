[main]
summary=GA402RK shared policy; TuneD owns CPU and platform controls

[acpi]
priority=10

[cpu]
priority=20
governor=powersave

[audio]
timeout=10

# TuneD 2.28's per-policy boost setter returns EINVAL on this 6900HS.
# The kernel's global interface works. Do not also use the cpu plugin's boost.
[sysfs]
priority=30

# amd-pstate leaves a previous non-boost ceiling in scaling_max_freq after
# global boost is re-enabled. Restore the driver's current legal ceiling after
# setting boost. GA402RK's homogeneous policies report the same hardware limit.
[sysfs_cpu_limits]
type=sysfs
priority=40
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq=${f:strip:${f:exec:cat:/sys/devices/system/cpu/cpufreq/policy0/cpuinfo_max_freq}}

[script]
priority=50
script=${i:PROFILE_DIR}/asus-thermal.py
