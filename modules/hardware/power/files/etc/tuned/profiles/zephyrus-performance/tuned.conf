[main]
summary=Zephyrus performance
include=zephyrus-common

[variables]
asus_platform=performance
asus_apu_limit=45
asus_platform_limit=60

[cpu]
energy_performance_preference=performance

[acpi]
platform_profile=performance

[sysfs]
/sys/devices/system/cpu/cpufreq/boost=1

[sysfs_cpu_limits]
type=sysfs
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq=4000000
