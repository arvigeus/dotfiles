[main]
default=balanced
battery_detection=true
# A firmware Quiet profile can represent both Balanced on DC and Powersave.
# Reverse-mapping it would discard the user's choice. Select through PPD.
sysfs_acpi_monitor=false

[profiles]
power-saver=zephyrus-powersave
balanced=zephyrus-balanced
performance=zephyrus-performance

[battery]
power-saver=zephyrus-powersave-battery
balanced=zephyrus-battery
performance=zephyrus-performance-battery
