# UI
autofit=70%
osc=no
script=/usr/share/mpv/scripts/uosc
osd-fonts-dir=/usr/share/mpv/fonts
script-opts-append=uosc-disable_elements=idle_indicator

# Video
vo=gpu-next
hwdec=auto

# Audio
ao=pipewire
alang=jpn,jp,eng,en
volume-max=300

# Subtitles
slang=eng,en,bg,vi,vn
sub-auto=fuzzy
# sub-codepage=cp1251

# Screenshots
screenshot-directory=~/Pictures
screenshot-template=mpv-%f-%wH.%wM.%wS.%wT-#%#00n

# Neutral scaling without extra shaders. Also resets optional profile settings.
[standard]
profile-desc=Standard
glsl-shaders-clr
scale=lanczos
cscale=lanczos
dscale=hermite
linear-downscaling=yes

[default]
profile=standard
